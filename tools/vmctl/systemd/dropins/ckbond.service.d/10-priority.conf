# Connection Keeper first (Marko, 14.11.2026). Takes effect at the next start of ckbond (a reboot); never restarted for it.
[Service]
Slice=vmcore.slice
CPUWeight=10000
IOWeight=10000
Nice=-15
IOSchedulingClass=realtime
IOSchedulingPriority=2
OOMScoreAdjust=-1000
MemoryMin=128M
LimitNOFILE=1048576
Restart=always
RestartSec=1
