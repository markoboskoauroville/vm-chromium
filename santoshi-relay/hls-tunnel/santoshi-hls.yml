# Cloudflare Tunnel "santoshi-hls" (15.11.2026, Marko chose the tunnel): live.santoshiband.org → MediaMTX HLS on this VM, nothing else.
# Every request reaches MediaMTX from 127.0.0.1, so its IP-bound HLS sessions hold; Cloudflare caches the segments by default (the proxy makes their URLs session-free and public).
# Origin: santoshi-hls-proxy on 127.0.0.1:8896 (hls_cache_proxy.py), which talks to MediaMTX https://127.0.0.1:8888 with ONE session.
tunnel: TUNNEL_ID
credentials-file: /etc/cloudflared/santoshi-hls.json
no-autoupdate: true
ingress:
  - hostname: live.santoshiband.org
    path: ^/santoshi/[A-Za-z0-9_.-]+\.(m3u8|mp4)$
    service: http://127.0.0.1:8896
  - service: http_status:404
