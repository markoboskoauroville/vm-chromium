# chromium-vm: tmux for Claude Code (2.11.2026). No tmux status line (the screen has its own status bar).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,vte*:RGB"
set -g status off
set -g history-limit 50000
set -g mouse on
set -s escape-time 10
set -g set-clipboard off
# A mouse selection goes to the X clipboard, which the Mac viewer syncs.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i >/dev/null 2>&1"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i >/dev/null 2>&1"
