# /etc/chromium-vm.conf: the settings of chromium-vm's Chromium-only screen.
# Written by stage1/setup.sh; edit here and `sudo systemctl restart chromium-vm-xvnc` to apply.
VM_USER=ubuntu
VNC_IP=100.102.86.30
VNC_PORT=5901
DISPLAY_NUM=1
# Start size only; the client's size takes over on connect (ExtendedDesktopSize / SetDesktopSize).
GEOMETRY=1920x1080
DPI=96
# deb = xtradeb PPA build (/usr/bin/chromium), snap = Ubuntu's snap (/snap/bin/chromium).
CHROMIUM_SOURCE=deb
